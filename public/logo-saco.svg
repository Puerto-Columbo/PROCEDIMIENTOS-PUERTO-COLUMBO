<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Shadow Gradients -->
    <radialGradient id="sackShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00172E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00172E" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Sack Fabric Gradient (Warm Canvas / Burlap Corporate Hue) -->
    <linearGradient id="sackBody" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#EADBBA"/>
      <stop offset="30%" stop-color="#D8C39E"/>
      <stop offset="70%" stop-color="#BC9E73"/>
      <stop offset="100%" stop-color="#9C7D52"/>
    </linearGradient>

    <linearGradient id="sackHighlight" x1="30%" y1="20%" x2="60%" y2="80%">
      <stop offset="0%" stop-color="#FFF5DE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF5DE" stop-opacity="0"/>
    </linearGradient>

    <!-- Top Folds Gradient -->
    <linearGradient id="sackTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6"/>
      <stop offset="50%" stop-color="#D3BC96"/>
      <stop offset="100%" stop-color="#A5855A"/>
    </linearGradient>

    <!-- Tied Rope Gradient (Corporate Navy & Gold) -->
    <linearGradient id="ropeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7B1C"/>
      <stop offset="35%" stop-color="#F5CE58"/>
      <stop offset="70%" stop-color="#E5B838"/>
      <stop offset="100%" stop-color="#8C6D15"/>
    </linearGradient>

    <linearGradient id="navySeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003B6F"/>
      <stop offset="100%" stop-color="#001D38"/>
    </linearGradient>
    
    <!-- Subtle Fabric Texture Pattern -->
    <pattern id="burlapPattern" width="10" height="10" patternUnits="userSpaceOnUse" opacity="0.12">
      <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#5A4020" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="100" cy="182" rx="68" ry="12" fill="url(#sackShadow)" />

  <!-- Main Sack Body (Bulging bottom, gathered top) -->
  <path d="M 72 70 
           C 54 82, 38 108, 38 136 
           C 38 165, 62 178, 100 178 
           C 138 178, 162 165, 162 136 
           C 162 108, 146 82, 128 70 
           Z" 
        fill="url(#sackBody)" 
        stroke="#7A5E38" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Overlay Fabric Texture Pattern -->
  <path d="M 72 70 
           C 54 82, 38 108, 38 136 
           C 38 165, 62 178, 100 178 
           C 138 178, 162 165, 162 136 
           C 162 108, 146 82, 128 70 
           Z" 
        fill="url(#burlapPattern)" />

  <!-- Sack Volume Highlight (Left / Front side) -->
  <path d="M 76 76 
           C 62 86, 50 108, 50 132 
           C 50 152, 66 166, 94 170 
           C 78 158, 68 138, 70 114 
           C 72 96, 80 84, 86 76 
           Z" 
        fill="url(#sackHighlight)" />

  <!-- Stitched Seam Lines (Reinforced Industrial Bag) -->
  <path d="M 52 142 C 60 162, 78 172, 100 173 C 122 172, 140 162, 148 142" 
        stroke="#8D6D42" 
        stroke-width="2" 
        stroke-dasharray="3 3" 
        stroke-linecap="round" 
        fill="none" />
  
  <path d="M 45 118 C 42 134, 46 150, 56 162" 
        stroke="#8D6D42" 
        stroke-width="1.8" 
        stroke-dasharray="3 2.5" 
        stroke-linecap="round" 
        fill="none" />

  <path d="M 155 118 C 158 134, 154 150, 144 162" 
        stroke="#8D6D42" 
        stroke-width="1.8" 
        stroke-dasharray="3 2.5" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Natural Sack Folds & Creases -->
  <path d="M 74 74 C 84 94, 88 116, 84 138" stroke="#8A6B3E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 126 74 C 116 94, 112 116, 116 138" stroke="#8A6B3E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 96 76 C 98 90, 99 104, 97 120" stroke="#9E7D4C" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Official Puerto Columbo Maritime Stamp on Sack Front -->
  <g transform="translate(100, 126)">
    <!-- Stamp Oval Border -->
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="#F8FAFC" fill-opacity="0.85" stroke="#003B6F" stroke-width="2.5" stroke-dasharray="4 2"/>
    <ellipse cx="0" cy="0" rx="27" ry="17" fill="none" stroke="#003B6F" stroke-width="1" opacity="0.5"/>
    
    <!-- Anchor / Maritime Star Icon -->
    <path d="M -5 -6 L 0 -11 L 5 -6 L 2 -6 L 2 3 C 2 5, 4 6, 7 4 L 7 6 C 4 8, -4 8, -7 6 L -7 4 C -4 6, -2 5, -2 3 L -2 -6 Z" fill="#003B6F" />
    <circle cx="0" cy="-11" r="1.5" fill="#E5B838" />

    <!-- "PUERTO COLUMBO" text -->
    <text x="0" y="8" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="5.5" fill="#003B6F" letter-spacing="0.8">PUERTO COLUMBO</text>
    <text x="0" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="4" fill="#C59B27" letter-spacing="0.5">CARGA PORTUARIA</text>
  </g>

  <!-- Top Gathered Ruffle / Mouth of the Sack (Above the tie) -->
  <path d="M 72 68 
           C 66 52, 54 36, 60 25 
           C 66 16, 80 28, 88 40 
           C 94 30, 106 30, 112 40 
           C 120 28, 134 16, 140 25 
           C 146 36, 134 52, 128 68 
           Z" 
        fill="url(#sackTop)" 
        stroke="#7A5E38" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Inside Dark Opening of Mouth -->
  <ellipse cx="100" cy="38" rx="14" ry="7" fill="#6E4F28" opacity="0.75" />

  <!-- Gather Fold Highlights on Top Ruffle -->
  <path d="M 64 27 C 72 38, 80 50, 84 64" stroke="#FFF0D4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 136 27 C 128 38, 120 50, 116 64" stroke="#8C6C3E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 100 42 C 100 50, 100 58, 100 66" stroke="#8C6C3E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Thick Tied Nautical Cord / Rope Wraps around neck -->
  <!-- Back wrap -->
  <rect x="70" y="64" width="60" height="9" rx="4.5" fill="#6A4D23" />
  
  <!-- Main Rope Windings (Golden braided rope) -->
  <!-- Winding 1 -->
  <path d="M 70 68 C 78 64, 122 64, 130 68" stroke="url(#ropeGold)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 70 68 C 78 64, 122 64, 130 68" stroke="#5C420F" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <!-- Winding 2 (Lower wrap) -->
  <path d="M 71 73 C 80 70, 120 70, 129 73" stroke="url(#ropeGold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 71 73 C 80 70, 120 70, 129 73" stroke="#5C420F" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <!-- Tied Knot in Center/Right -->
  <ellipse cx="118" cy="71" rx="6.5" ry="5.5" fill="url(#ropeGold)" stroke="#6B4F10" stroke-width="1.5" />
  <circle cx="118" cy="71" r="2.5" fill="#4A3408" />

  <!-- Hanging Cord Ends with Frayed Tassels -->
  <!-- Left Hanging Cord -->
  <path d="M 116 75 C 114 84, 110 92, 112 102" stroke="url(#ropeGold)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Left Tassel -->
  <path d="M 112 102 L 109 110 M 112 102 L 112 111 M 112 102 L 115 110" stroke="#B89228" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right Hanging Cord -->
  <path d="M 120 75 C 124 85, 128 94, 126 106" stroke="url(#ropeGold)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Right Tassel -->
  <path d="M 126 106 L 123 114 M 126 106 L 126 115 M 126 106 L 129 113" stroke="#B89228" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Corporate Tag / Shipping Label hanging from rope -->
  <g transform="translate(73, 76) rotate(-10)">
    <!-- Label String -->
    <path d="M 5 0 L 10 10" stroke="#7A5E38" stroke-width="1.5" fill="none"/>
    <!-- Tag Card -->
    <rect x="2" y="10" width="22" height="30" rx="2" fill="#FFFFFF" stroke="#003B6F" stroke-width="1.5" />
    <circle cx="13" cy="14" r="1.5" fill="#003B6F" />
    <!-- Tag Barcode & Lines -->
    <rect x="5" y="18" width="16" height="2" fill="#003B6F" />
    <line x1="5" y1="23" x2="19" y2="23" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="1 1"/>
    <line x1="5" y1="27" x2="19" y2="27" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 1"/>
    <text x="13" y="36" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="4" fill="#003B6F">VAP</text>
  </g>
</svg>
